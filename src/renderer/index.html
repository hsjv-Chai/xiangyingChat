<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' localimg: https: data:; media-src 'self' localimg: https:;">
  <title>响应消息</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside class="icon-rail">
      <div class="logo" title="聊天记录阅读器">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </div>
      <div class="rail-spacer"></div>
      <button id="settingsBtn" class="rail-btn" title="设置">⚙</button>
    </aside>

    <aside class="sidebar">
      <div class="sidebar-search">
        <input id="convSearch" type="text" placeholder="搜索会话">
      </div>
      <div id="convList" class="conv-list"></div>
      <div class="sidebar-footer">
        <button id="openFolderBtn" class="primary-btn open-folder" style="flex:1">打开文件夹</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div class="chat-title-info">
          <div id="chatTitle" class="chat-title"></div>
          <div id="chatSub" class="chat-sub"></div>
        </div>
        <div class="chat-actions">
          <button id="exportBtn" class="icon-btn" title="选择消息并导出为图片">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
          </button>
          <button id="chatSearchBtn" class="icon-btn" title="搜索聊天记录">🔍</button>
        </div>
      </header>

      <div id="selectBar" class="select-bar">
        <span class="select-info">已选 <b id="selectCount">0</b> 条</span>
        <div class="select-actions">
          <button id="selectAllBtn" class="secondary-btn">全选</button>
          <button id="clearSelBtn" class="secondary-btn">清空</button>
          <button id="exportSelBtn" class="primary-btn">导出选中</button>
          <button id="cancelSelBtn" class="secondary-btn">取消</button>
        </div>
      </div>

      <div id="chatSearchBar" class="chat-search">
        <input id="chatSearch" type="text" placeholder="搜索当前会话内容">
        <span id="matchCount" class="match-count">0/0</span>
        <button id="prevBtn" class="icon-btn" title="上一处">↑</button>
        <button id="nextBtn" class="icon-btn" title="下一处">↓</button>
        <button id="closeSearch" class="icon-btn" title="关闭">✕</button>
      </div>

      <div id="messages" class="messages"></div>
    </main>
  </div>

  <div id="lightbox" class="lightbox">
    <div class="lightbox-tools">
      <button id="lbZoomOut" title="缩小">−</button>
      <button id="lbZoomIn" title="放大">+</button>
      <button id="lbReset" title="重置">⤢</button>
      <button id="lbSave" title="保存图片为文件">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button id="lbClose" title="关闭">✕</button>
    </div>
    <img id="lightboxImg" alt="图片预览">
  </div>

  <div id="settingsModal" class="modal-overlay">
    <div class="modal">
      <h3>设置</h3>
      <label>将以下发送者标记为“我”（留空则全部靠左显示）</label>
      <input id="settingsMe" type="text" placeholder="例如：邱明峰">
      <div class="folder-path">当前文件夹：<span id="settingsFolder">未选择</span></div>
      <div class="modal-actions">
        <button id="settingsClose" class="secondary-btn">取消</button>
        <button id="settingsSave" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
